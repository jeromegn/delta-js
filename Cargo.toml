[package]
name = "delta-js"
version = "0.0.0"
authors = ["Julien Guillot", "Jerome Gravel-Niquet"]
edition = "2021"
homepage = "https://github.com/jeromegn/delta-js"
repository = "https://github.com/jeromegn/delta-js"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Default enable napi4 feature, see https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.0.0-beta.8", default-features = false, features = [
    "napi9",
    "compat-mode",
    "serde-json",
    "web_stream",
] }
napi-derive = { version = "3.0.0-beta.8" }
deltalake = { version = "0.26.2", features = [
    "s3",
    "datafusion",
], git = "https://github.com/jeromegn/delta-rs.git", branch = "rust-v0.26.2-fix-vacuum" }
futures = "0.3"
tokio = { version = "1" }
tokio-stream = "0.1"
serde_json = "1.0.108"
chrono = "0.4.39"
parking_lot = "0.12.3"
thiserror = "2.0.12"
arrow-schema = { version = "55", features = ["serde"] }

[build-dependencies]
napi-build = "3.0.0-beta.0"

# [profile.release]
# codegen-units = 1
# lto = "fat"
