
[package]
name = "delta-js"
version = "0.0.0"
authors = ["Julien Guillot", "Jerome Gravel-Niquet"]
edition = "2021"
homepage = "https://github.com/jeromegn/delta-js"
repository = "https://github.com/jeromegn/delta-js"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
futures = "0.3"
tokio-stream = "0.1"
serde_json = "1.0.108"
chrono = "0.4.39"
parking_lot = "0.12.3"
thiserror = "2.0.12"
delta_kernel = { version = "0.12.1", features = ["arrow"] }
async-trait = "0.1.88"

[dependencies.napi]
version = "3.0.0-beta.12"
default-features = false
features = ["napi9", "compat-mode", "serde-json", "web_stream"]

[dependencies.napi-derive]
version = "3.0.0-beta.12"

[dependencies.deltalake]
version = "0.26.2"
features = ["s3", "datafusion"]
git = "https://github.com/jeromegn/delta-rs.git"
branch = "fix-generated-cols"

[dependencies.tokio]
version = "1"

[dependencies.arrow-schema]
version = "55"
features = ["serde"]

[build-dependencies]
napi-build = "3.0.0-beta.0"
